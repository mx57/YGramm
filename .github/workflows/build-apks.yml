name: Build Single YggGram arm64-v8a Release APK

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64-v8a-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode debug.keystore from base64
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build YggGram-arm64-v8a.apk and Run Unit Tests
        run: |
          rm -f YggGram-main.apk YggGram-clone-node2.apk apk-releases/YggGram-main.apk apk-releases/YggGram-clone-node2.apk
          gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest
          gradle :app:assembleDebug
          mkdir -p apk-releases
          cp app/build/outputs/apk/debug/app-debug.apk apk-releases/YggGram-arm64-v8a.apk

      - name: Commit Single Release APK to apk-releases/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch YggGram-main.apk YggGram-clone-node2.apk apk-releases/YggGram-main.apk apk-releases/YggGram-clone-node2.apk build-root-apks.sh
          git add -f apk-releases/YggGram-arm64-v8a.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build single YggGram-arm64-v8a.apk in apk-releases/ [skip ci]"
            git push
          fi

      - name: Upload Compiled arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YggGram-arm64-v8a-APK
          path: |
            apk-releases/YggGram-arm64-v8a.apk
