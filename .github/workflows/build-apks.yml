name: Build & Commit YggGram Main + Clone APKs to Repo Root

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-commit-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode debug.keystore from base64
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build YggGram-clone-node2.apk (Node #2 Clone Package)
        run: |
          sed -i 's/applicationId = "com.aistudio.ygggram.vxkprm"/applicationId = "com.aistudio.ygggram.vxkprm.node2"/' app/build.gradle.kts
          sed -i 's/<string name="app_name">YggGram<\/string>/<string name="app_name">YggGram Клон #2<\/string>/' app/src/main/res/values/strings.xml
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk YggGram-clone-node2.apk
          mkdir -p apk-releases
          cp YggGram-clone-node2.apk apk-releases/YggGram-clone-node2.apk
          git checkout -- app/build.gradle.kts app/src/main/res/values/strings.xml

      - name: Build YggGram-main.apk (Node #1 Main Package) and Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk YggGram-main.apk
          cp YggGram-main.apk apk-releases/YggGram-main.apk

      - name: Commit Compiled APKs to Repository Root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f YggGram-main.apk YggGram-clone-node2.apk apk-releases/YggGram-main.apk apk-releases/YggGram-clone-node2.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): place compiled YggGram-main.apk and YggGram-clone-node2.apk in repository root [skip ci]"
            git push
          fi

      - name: Upload Compiled APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YggGram-Root-APKs
          path: |
            YggGram-main.apk
            YggGram-clone-node2.apk
            apk-releases/*.apk
