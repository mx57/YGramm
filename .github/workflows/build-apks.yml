name: Build and test YggGram arm64-v8a

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64-v8a-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build native Yggdrasil core (arm64-v8a)
        run: |
          # libygggram.so is not tracked in git; without this step every
          # published APK ships without the core («НЕТ ЯДРА»).
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$NDK" || { echo "NDK not found on runner"; exit 1; }
          cd core
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go build -buildmode=c-shared -o ../app/src/main/jniLibs/arm64-v8a/libygggram.so ./cmd/libygggram
          cd ..
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Decode debug.keystore from base64
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests and build both variants
        run: |
          gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest
          gradle :app:assembleDebug
          # Release always builds here: R8, resource shrinking and the manifest merge are
          # checked on every push even though the runner has no upload key to sign with.
          gradle :app:assembleRelease
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/release

      - name: Verify APK ships the native core
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libygggram.so' \
            || { echo "APK is missing libygggram.so — refusing to publish a core-less build"; exit 1; }
          echo "native core present in APK"

      - name: Upload installable debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: YggGram-arm64-v8a-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
