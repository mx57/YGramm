name: Build and test YggGram arm64-v8a

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64-v8a-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Robolectric refuses to sandbox API 36 (the app's targetSdk) on an older JVM:
          # "Failed to create a Robolectric sandbox: Android SDK 36 requires Java 21
          # (have Java 17)". 21 is what the suite is run with locally, so CI and the
          # developer now exercise the same thing.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build native Yggdrasil core (arm64-v8a)
        run: |
          # libygggram.so is not tracked in git; without this step every
          # published APK ships without the core («НЕТ ЯДРА»).
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$NDK" || { echo "NDK not found on runner"; exit 1; }
          cd core
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go build -buildmode=c-shared -o ../app/src/main/jniLibs/arm64-v8a/libygggram.so ./cmd/libygggram
          cd ..
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Create the debug signing keystore
        run: |
          # app/build.gradle.kts pins the debug build to ${rootDir}/debug.keystore and that
          # file is gitignored, so :app:validateSigningDebug fails on a fresh runner.
          # A debug keystore is a throwaway build artifact, not a secret: generate it here
          # instead of committing key material.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore

      - name: Run unit tests and build both variants
        run: |
          # The whole suite, not one class: the Robolectric tests are the ones that
          # prove delivery, peer truth and clean start, and filtering them out left
          # regressions merging with a green check.
          gradle :app:testDebugUnitTest
          gradle :app:assembleDebug
          # Release always builds here: R8, resource shrinking and the manifest merge are
          # checked on every push even though the runner has no upload key to sign with.
          gradle :app:assembleRelease
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/release

      - name: Verify APK ships the native core
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libygggram.so' \
            || { echo "APK is missing libygggram.so — refusing to publish a core-less build"; exit 1; }
          echo "native core present in APK"

      - name: Upload installable debug test APK
        uses: actions/upload-artifact@v4
        # The account-wide artifact quota is shared by every repository and is
        # recalculated every 6-12 hours, so an upload can fail on a run that built
        # and tested everything correctly. Deliverables live in apk-releases/ in the
        # tree, so a refused upload is reported but must not redden the pipeline.
        continue-on-error: true
        with:
          name: YggGram-arm64-v8a-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          # An APK is ~40 MB and the repository artifact quota is shared and small.
          # Without this the quota fills, and a run that built and tested everything
          # correctly still goes red on the upload.
          retention-days: 1
